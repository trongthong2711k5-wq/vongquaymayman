<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trạm Quà Tặng Dễ Thương 🌸</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="floating-shapes shape-1">💖</div>
    <div class="floating-shapes shape-2">✨</div>
    <div class="floating-shapes shape-3">🌸</div>
    <div class="floating-shapes shape-4">🧸</div>
    
    <div class="container">
        <h1>Trạm Quà Tặng 🌸</h1>
        
        <div id="loginScreen">
            <p class="subtitle">Nhập tên của bạn để Mị ghi nhận phần thưởng nhé!</p>
            <div style="margin-bottom: 20px;">
                <input type="text" id="inputTenKhach" placeholder="VD: Lan Nguyễn..." style="width: 100%; padding: 15px; border: 3px solid #ffb6c1; border-radius: 20px; font-family: 'Nunito', sans-serif; font-size: 16px; text-align: center; outline: none; box-sizing: border-box;" />
            </div>
            <button class="tab-btn active" onclick="xacNhanTen()" style="width: 100%; padding: 15px; border-radius: 20px; font-size: 16px; margin-bottom: 15px;">Vào Chơi Ngay</button>
        </div>

        <div id="mainGameScreen" style="display: none;">
            <p class="subtitle">Chào <span id="tenHienThi" style="color:#ff477e; font-weight:900;"></span>! Hãy thử xem hôm nay vũ trụ gửi gì cho bạn nhé!</p>
            
            <div class="tab-buttons">
                <button class="tab-btn active" onclick="doiGiaoDien('bocTham')">🎁 Bốc Thăm</button>
                <button class="tab-btn" onclick="doiGiaoDien('vongQuay')">🎡 Vòng Quay</button>
            </div>

            <div id="bocThamSection" class="game-section">
                <div id="giftList" class="gift-grid"></div>
            </div>

            <div id="vongQuaySection" class="game-section" style="display: none;">
                <div class="add-box">
                    <input type="text" id="inputTenQua" placeholder="Thêm món quà mới vô đây..." />
                    <button class="btn-add" onclick="themQuaMoi()">Thêm</button>
                </div>
                <div class="manage-gifts-box">
                    <ul id="manageGiftsList" class="manage-gifts-list"></ul>
                </div>
                <div class="wheel-container">
                    <canvas id="wheelCanvas" width="300" height="300"></canvas>
                    <div class="wheel-marker">🎀</div>
                </div>
                <button id="btnQuay" class="btn btn-main" onclick="batDauQuay()">Quay Ngay Thôi!</button>
            </div>
            <div id="result"></div>
        </div>

        <div id="adminScreen" style="display: none; text-align: left;">
            <h2 style="color: #ff477e; text-align: center; margin-bottom: 5px;">👑 Lịch Sử Nhận Quà</h2>
            <p style="text-align: center; font-size: 12px; color: #636e72; margin-bottom: 15px;">Danh sách khách hàng đã trúng thưởng</p>
            
            <div style="max-height: 350px; overflow-y: auto; background: #fff9fb; border-radius: 15px; padding: 10px; border: 2px dashed #ffb6c1;">
                <table style="width: 100%; border-collapse: collapse; font-size: 13px;">
                    <thead>
                        <tr style="border-bottom: 2px solid #ffb6c1; color: #ff477e;">
                            <th style="padding: 8px 5px; text-align: left;">Thời Gian</th>
                            <th style="padding: 8px 5px; text-align: left;">Khách</th>
                            <th style="padding: 8px 5px; text-align: left;">Quà</th>
                        </tr>
                    </thead>
                    <tbody id="adminHistoryList"></tbody>
                </table>
            </div>
            
            <button onclick="xoaNhoTam()" style="width: 100%; border: none; padding: 12px; border-radius: 20px; font-weight: bold; margin-top: 15px; cursor: pointer; background: #ffeaa7; color: #d35400;">🔄 Xóa bộ nhớ máy này (Để Test lại)</button>
            <button class="btn-main" onclick="dongAdmin()" style="width: 100%; border: none; padding: 12px; border-radius: 20px; font-weight: bold; margin-top: 10px; cursor: pointer;">Thoát</button>
        </div>

        <!-- NÚT ADMIN ĐÃ ĐƯỢC MANG RA NGOÀI (LUÔN HIỂN THỊ) -->
        <div style="margin-top: 25px; font-size: 11px; text-align: center; width: 100%;">
            <a href="#" onclick="moAdmin()" style="color: #ffb6c1; text-decoration: none; font-weight: bold;">👑 Quản Trị Viên</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js?v=6"></script> 
</body>
</html>
