<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trạm Quà Bí Ẩn 🎁</title>
    <!-- Phông chữ siêu xinh -->
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Icon bay lơ lửng -->
    <div class="floating-shapes shape-1">☁️</div>
    <div class="floating-shapes shape-2">✨</div>
    <div class="floating-shapes shape-3">🎀</div>

    <div class="glass-container">
        <h1>Trạm Quà Bí Ẩn 🌸</h1>
        
        <!-- MÀN HÌNH 1: NHẬP TÊN -->
        <div id="loginScreen" class="screen-active">
            <p class="subtitle">Nhập tên của bạn để nhận quà từ Mị nhé!</p>
            <div class="input-group">
                <input type="text" id="inputTenKhach" placeholder="VD: Lan Nguyễn..." autocomplete="off" />
            </div>
            <button class="btn-glow" onclick="xacNhanTen()">Mở Quà Ngay</button>
        </div>

        <!-- MÀN HÌNH 2: CHỌN TÚI MÙ -->
        <div id="gameScreen" style="display: none;">
            <p class="subtitle">Xin chào <span id="tenHienThi" class="highlight-text"></span>!<br>Bạn có 1 lượt chọn túi mù duy nhất.</p>
            <div id="boxGrid" class="box-grid"></div>
        </div>

        <!-- MÀN HÌNH 3: KẾT QUẢ -->
        <div id="resultCard" class="result-card" style="display: none;">
            <div class="congrats-icon">🎉</div>
            <h2>Tadaaa!</h2>
            <p class="result-owner">Khách hàng: <span id="tenKhachKetQua"></span></p>
            <div id="resultText" class="prize-name"></div>
            <div class="divider"></div>
            <p class="note">Lưu ý: Mị đã ghi nhận hệ thống. Hãy chụp ảnh màn hình này gửi cho Mị để nhận quà nhé! 💌</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
